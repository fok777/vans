name: CI Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_app:
    runs-on: macos-latest
    name: Build App
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # HyperCeiler-Android13-Backport: 仓库自带 wrapper jar 不在 action 已知校验列表内
          validate-wrappers: false
          cache-overwrite-existing: true

      - name: Build with Gradle (Debug)
        env:
          GIT_ACTOR: ${{ secrets.GIT_ACTOR }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APKs
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename $APK_FILE .apk)" >> $GITHUB_ENV

      - name: Show APKs SHA256
        if: success()
        run: |
          echo "### Build Success" >> $GITHUB_STEP_SUMMARY
          echo "|Artifact|SHA256|" >> $GITHUB_STEP_SUMMARY
          echo "|:---:|:---|" >> $GITHUB_STEP_SUMMARY
          APK_SHA256=($(shasum -a 256 ${{ env.APK_FILE }}))
          echo "|Debug|$APK_SHA256" >> $GITHUB_STEP_SUMMARY

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          compression-level: 9

      # HyperCeiler-Android13-Backport:
      # minSdk 由 35 降到 33，凡是调用 Android 34/35+ 框架 API 的地方都会在运行时抛
      # NoSuchMethodError（Stream.toList() 就是一例）。这里跑 lint 把剩余问题报出来。
      - name: Lint API audit (minSdk 33 backport)
        continue-on-error: true
        run: |
          ./gradlew lintDebug --stacktrace > lint.log 2>&1
          echo "gradlew exit: $?"
          python3 scripts/lint_audit.py || true

      - name: Upload lint audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-api-audit
          path: |
            lint-api-audit.txt
            lint.log
          if-no-files-found: warn
          compression-level: 9

      # HyperCeiler-Android13-Backport:
      # 把审计报告直接写进 Job Summary，这样不用回推仓库（回推会和并发 push 抢锁而失败），
      # 也不会再触发新一轮构建。
      - name: Print lint audit to summary
        if: always()
        run: |
          echo "## Lint API audit (minSdk 33)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -100 lint-api-audit.txt 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "no audit output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
