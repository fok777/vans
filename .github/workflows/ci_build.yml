name: CI Build (Android 13 / a13_eol)

on:
  push:
    branches: [a13]
  workflow_dispatch:

jobs:
  build_app:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: macos-latest
    name: Build App
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          cache-overwrite-existing: true

      - name: Build with Gradle (Debug)
        id: gradle
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          tail -200 build.log > ci-tail.log

      - name: Find APKs
        if: success()
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename $APK_FILE .apk)" >> $GITHUB_ENV

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          compression-level: 9

      - name: Push build log back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-logs
          cp ci-tail.log ci-logs/build-tail.log 2>/dev/null || echo "no log" > ci-logs/build-tail.log
          git add ci-logs/build-tail.log
          git commit -m "ci: build log [skip ci]" || echo "no change"
          git pull --rebase origin a13
          git push origin HEAD:a13
