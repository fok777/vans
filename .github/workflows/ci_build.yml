name: CI Build (Android 13 / a13_eol)

on:
  push:
    branches: [a13]
  workflow_dispatch:

jobs:
  build_app:
    runs-on: macos-latest
    name: Build App
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          cache-overwrite-existing: true

      - name: Build with Gradle (Debug)
        id: gradle
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
          echo "gradle exit: $?"

      - name: Find APKs
        if: success() || steps.gradle.outcome == 'success'
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename $APK_FILE .apk)" >> $GITHUB_ENV

      - name: Upload APKs
        if: env.APK_FILE != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          compression-level: 9

      # 日志下载被外部网络策略拦截，改为回传到独立分支，避免与 a13 并行推送抢锁
      - name: Push build log to a13-logs branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan a13-logs-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          tail -300 build.log > build-tail.log 2>/dev/null || echo "no build.log" > build-tail.log
          git add -f build-tail.log
          git commit -m "ci: a13 build log [skip ci]" || echo "no change"
          git push -f origin a13-logs-tmp:a13-logs
