name: Diagnose Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: macos-latest
    name: Capture Gradle Failure
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Run Gradle and capture output
        env:
          GIT_ACTOR: ${{ secrets.GIT_ACTOR }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1 || true
          tail -250 build.log > diag-tail.log
          echo "=== ENV ===" >> diag-tail.log
          echo "ANDROID_HOME=$ANDROID_HOME" >> diag-tail.log
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> diag-tail.log
          ls "$ANDROID_HOME/platforms" >> diag-tail.log 2>&1
          ls "$ANDROID_HOME/build-tools" >> diag-tail.log 2>&1
          java -version >> diag-tail.log 2>&1

      - name: Commit log back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B diag-logs
          mkdir -p ci-logs
          cp diag-tail.log ci-logs/diag-tail.log
          git add ci-logs/diag-tail.log
          git commit -m "ci: diag log [skip ci]" || echo "no change"
          git push -f origin diag-logs
